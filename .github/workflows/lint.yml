name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: homelab-runners
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: setup-tofu
        id: setup-tofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: "1.12.2"
          # The wrapper shells out via `env node`, but our self-hosted runner
          # has no system Node on PATH. We don't read step outputs, so disable it.
          tofu_wrapper: false

      - name: tofu fmt
        id: tofu-fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        id: tofu-init
        run: tofu init -backend=false -input=false

      - name: tofu validate
        id: tofu-val
        run: tofu validate

      - name: setup tflint
        id: setup-tflint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

      - name: tflint
        id: tflint
        run: tflint
