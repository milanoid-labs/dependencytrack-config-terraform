name: Tofu Apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: homelab-runners

    env:
      TF_VAR_dependencytrack_api_key: ${{ secrets.TF_VAR_DEPENDENCYTRACK_API_KEY }}

    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: setup opentofu
        id: setup-opentofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: "1.12.2"
          # The wrapper shells out via `env node`, but our self-hosted runner
          # has no system Node on PATH. We don't read step outputs, so disable it.
          tofu_wrapper: false

      - name: configure aws credentials
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}

      - name: tofu init
        id: tofu-init
        run: tofu init -input=false

      - name: tofu plan
        id: tofu-plan
        run: tofu plan -input=false -out tfplan

      - name: tofu apply
        id: tofu-apply
        run: tofu apply -input=false -auto-approve tfplan
